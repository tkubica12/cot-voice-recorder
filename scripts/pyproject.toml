[project]
name = "voiceprompt-test-tools"
version = "1.0.0"
description = "Independent synthetic contract, storage SDK and regression test tools."
requires-python = ">=3.13"
dependencies = [
    "pyjwt[crypto]>=2.9,<3.0",
    "azure-core>=1.32,<2.0",
    "azure-storage-blob>=12.24,<13.0",
    "azure-storage-queue>=12.12,<13.0",
    "azure-data-tables>=12.5,<13.0",
    "httpx>=0.27,<1.0",
    "websockets>=17.1,<18",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "approved"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
