[project]
name = "voice-recorder"
version = "1.0.0"
description = "Cloud backend for the cot-voice-recorder personal voice-prompt system."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tomáš Kubica" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "azure-identity>=1.19,<2.0",
    "azure-core>=1.32,<2.0",
    "azure-storage-blob>=12.24,<13.0",
    "azure-storage-queue>=12.12,<13.0",
    "azure-data-tables>=12.5,<13.0",
    "azure-messaging-webpubsubservice>=1.2,<2.0",
    "openai>=1.55,<2.0",
]

[project.scripts]
voice-recorder = "voice_recorder.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    # Reads openapi/voice-recorder.yaml in the schema-driven contract tests. Already a
    # transitive dependency of uvicorn[standard]; declared here so the tests own it.
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_recorder"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.13"
packages = ["voice_recorder"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "azurite: integration tests that require a running Azurite emulator (opt-in).",
]
filterwarnings = ["error::DeprecationWarning:voice_recorder.*"]
