[package]
name = "voiceprompt-cloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Staged Rust VoicePrompt API, worker and cleanup implementation."

[features]
loopback-fixtures = []

[[bin]]
name = "voice-recorder"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
voiceprompt-core = { path = ".." }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "original-uri"] }
base64 = "0.23.1"
caseless = "0.2.2"
futures-util = { version = "0.3.34", features = ["sink"] }
fancy-regex = "0.16.2"
getrandom = "0.4.3"
jsonwebtoken = { version = "9.3.1", default-features = false }
quick-xml = { version = "=0.38.3", features = ["serialize"] }
regex = "1.13.1"
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "multipart", "native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
sha1 = { version = "0.11.0", default-features = false }
subtle = "2.6.1"
time = { version = "=0.3.45", features = ["serde-well-known", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.8"
unicode-general-category = "=0.6.0"
unicode-normalization = "=0.1.23"
unicode_names2 = "2.0.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "getrandom"] }

[target.'cfg(windows)'.dev-dependencies]
voiceprompt-client-protocol = { path = "../client-protocol", features = ["loopback-fixtures"] }
voiceprompt-windows-pilot = { path = "../windows-pilot" }
