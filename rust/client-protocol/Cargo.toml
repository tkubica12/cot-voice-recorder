[package]
name = "voiceprompt-client-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Authentication and realtime contracts for the VoicePrompt Rust client."

[lints]
workspace = true

[dependencies]
voiceprompt-core = { path = ".." }
base64 = "0.23.1"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.3", default-features = false, features = ["form", "json", "native-tls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6.1"
time = { version = "=0.3.45", features = ["serde-well-known", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.8"
