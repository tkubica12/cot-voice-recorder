[package]
name = "voiceprompt-client-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Authentication and realtime contracts for the VoicePrompt Rust client."

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6.1"
time = { version = "=0.3.45", features = ["serde-well-known", "parsing", "formatting"] }
url = "2.5.8"
