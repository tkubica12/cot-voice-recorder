[package]
name = "voiceprompt-windows-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Isolated native Windows foundation for the VoicePrompt Rust migration."

[[bin]]
name = "VoicePromptRustPilot"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
voiceprompt-client-protocol = { path = "../client-protocol" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
