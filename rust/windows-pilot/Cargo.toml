[package]
name = "voiceprompt-windows-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Isolated native Windows foundation for the VoicePrompt Rust migration."

[[bin]]
name = "VoicePromptRustPilot"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
voiceprompt-client-protocol = { path = "../client-protocol" }
voiceprompt-core = { path = ".." }
time = { version = "=0.3.45", features = ["serde-well-known", "parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[build-dependencies]
winresource = "=0.1.30"
