# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Azure Developer CLI project mapping for cot-voice-recorder.
#
# NOTE: The authoritative, repeatable deployment path is infra/deploy.ps1 (a
# separate provision -> published GHCR image -> app deploy flow. The
# Container Apps use an already published immutable public GHCR digest, and
# Storage is private so the API only becomes healthy once RBAC + private DNS are
# in place). `azd provision` can create the infrastructure (deployApps=false),
# but use deploy.ps1 for the full end-to-end flow. See infra/README.md.
name: cot-voice-recorder
metadata:
  template: cot-voice-recorder@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

# Image publishing is exclusively .github/workflows/publish-cloud.yml.
# Keep azd provision available, but do not implicitly build/push to ACR or
# perform a production image cutover through azd deploy.
