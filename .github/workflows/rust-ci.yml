name: rust-ci

on:
  push:
    paths:
      - "rust/**"
      - "windows/src/VoicePrompt.App/**"
      - "windows/src/VoicePrompt.Core/**"
      - "windows/tools/ClientFixture/**"
      - "scripts/measure_clients.py"
      - "scripts/measure_synthetic_capture.py"
      - "scripts/tests/test_full_client_fixture.py"
      - ".cargo/config.toml"
      - "scripts/Measure-VoicePromptProcess.ps1"
      - "scripts/Measure-RustNativePilot.ps1"
      - "scripts/MeasurementReport.psm1"
      - "scripts/tests/Test-ProcessMeasurement.ps1"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "windows/src/VoicePrompt.App/**"
      - "windows/src/VoicePrompt.Core/**"
      - "windows/tools/ClientFixture/**"
      - "scripts/measure_clients.py"
      - "scripts/measure_synthetic_capture.py"
      - "scripts/tests/test_full_client_fixture.py"
      - ".cargo/config.toml"
      - "scripts/Measure-VoicePromptProcess.ps1"
      - "scripts/Measure-RustNativePilot.ps1"
      - "scripts/MeasurementReport.psm1"
      - "scripts/tests/Test-ProcessMeasurement.ps1"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  msrv-check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install declared compiler in the disposable CI runner
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Fetch the existing locked approved graph
        run: cargo +1.85.0 fetch --locked
      - name: Check all workspace targets with the declared MSRV
        run: cargo +1.85.0 check --workspace --all-targets --offline --locked
  cloud-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust cloud image without publishing or deployment
        run: docker build --file rust/cloud/Dockerfile --tag voiceprompt-rust-fixture .
        working-directory: .
      - name: Verify unprivileged CLI and reject missing production config
        working-directory: .
        run: |
          docker run --rm --entrypoint id voiceprompt-rust-fixture -u | grep '^10001$'
          docker run --rm voiceprompt-rust-fixture --help
          if docker run --rm voiceprompt-rust-fixture check-config; then
            echo "Missing production config must not succeed."
            exit 1
          fi
  offline-checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Installed Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Fetch locked approved dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Test without registry access
        run: cargo test --workspace --offline --locked

      - name: Clippy
        run: cargo clippy --workspace --offline --locked --all-targets -- -D warnings

      - name: Build audio contract probe
        run: cargo build --offline --locked --release --example audio_contract

      - name: Build client contract probe
        run: cargo build --offline --locked --release -p voiceprompt-client-protocol --example client_contract

      - name: Build cloud entity contract probe
        run: cargo build --offline --locked --release -p voiceprompt-cloud --example entity_contract

      - name: Windows process measurement safeguards
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: .\scripts\tests\Test-ProcessMeasurement.ps1

      - name: Build native Windows pilot
        if: runner.os == 'Windows'
        run: cargo build --offline --locked --release -p voiceprompt-windows-pilot

      - name: Build existing C# DPAPI reference
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet restore rust\tests\reference\ReferenceAudio.csproj --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build rust\tests\reference\ReferenceAudio.csproj -c Release --no-restore

      - name: Windows DPAPI parity and startup guards
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: >
          python rust\windows-pilot\tests\test_platform_parity.py
          --pilot rust\target\release\VoicePromptRustPilot.exe
          --reference rust\tests\reference\bin\Release\net8.0\ReferenceAudio.dll

      - name: Windows OAuth, realtime and encrypted token-store parity
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: >
          python rust\client-protocol\tests\test_client_parity.py
          --client rust\target\release\examples\client_contract.exe
          --pilot rust\target\release\VoicePromptRustPilot.exe
          --reference rust\tests\reference\bin\Release\net8.0\ReferenceAudio.dll

      - name: Windows recovery manifest v1-v4 compatibility
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: >
          python rust\windows-pilot\tests\test_recovery_parity.py
          --pilot rust\target\release\VoicePromptRustPilot.exe
          --reference rust\tests\reference\bin\Release\net8.0\ReferenceAudio.dll

      - name: Windows dictation text and legacy audio checkpoint parity
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: >
          python rust\client-protocol\tests\test_dictation_parity.py
          --client rust\target\release\examples\client_contract.exe
          --reference rust\tests\reference\bin\Release\net8.0\ReferenceAudio.dll

      - name: Build actual C# application fixture through the approved feed
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet restore windows\tools\ClientFixture\ClientFixture.csproj --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build windows\tools\ClientFixture\ClientFixture.csproj -c Release --no-restore

      - name: Full client fixture guards without physical ports or installed state
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: >
          python scripts\tests\test_full_client_fixture.py
          --csharp windows\tools\ClientFixture\bin\Release\net8.0-windows\win-x64\VoicePromptClientFixture.exe
          --rust rust\target\release\VoicePromptRustPilot.exe

      - name: Bounded synthetic engine collector smoke, never hour or full-client acceptance
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $messages = cargo test --manifest-path rust\Cargo.toml -p voiceprompt-windows-pilot --lib --release --no-run --offline --locked --message-format json
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic release fixture build failed.' }
          $binary = $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } | Select-Object -ExpandProperty executable
          if (@($binary).Count -ne 1) { throw 'Expected exactly one native libtest fixture.' }
          $frozen = Join-Path $env:RUNNER_TEMP 'native-capture-fixture'
          $output = Join-Path $env:RUNNER_TEMP 'native-capture-smoke'
          New-Item -ItemType Directory -Path $frozen,$output -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $frozen 'VoicePromptNativeCaptureFixture.exe')
          python scripts\measure_synthetic_capture.py --oracle (Join-Path $frozen 'VoicePromptNativeCaptureFixture.exe') --output-directory $output --source-revision $env:GITHUB_SHA --audio-seconds 3 --idle-samples 3
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic collector smoke failed.' }
          $report = Get-Content -Raw (Join-Path $output 'synthetic-engine-hour.json') | ConvertFrom-Json
          if ($report.sufficient_for_synthetic_engine_hour -or $report.full_client_profile -or $report.whole_migration_acceptance) { throw 'Smoke must not claim hour/full-client acceptance.' }
