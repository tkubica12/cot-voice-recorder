name: windows-ci

on:
  push:
    paths:
      - "rust/**"
      - "assets/windows/**"
      - "scripts/Build-RustWindowsInstaller.ps1"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "assets/windows/**"
      - "scripts/Build-RustWindowsInstaller.ps1"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the existing locked Rust graph
        run: cargo fetch --manifest-path rust\Cargo.toml --locked
      - name: Build the normal credential-free native installer without running it
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) { throw 'The runner must provide the existing Inno Setup compiler; this job never installs tooling.' }
          .\scripts\Build-RustWindowsInstaller.ps1 -Compiler $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Native installer build failed.' }
          $stage = 'rust\target\installer-staging'
          $names = @(Get-ChildItem -LiteralPath $stage -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($names -join ',') -ne 'app.ico,VoicePrompt.exe') { throw 'Unexpected installer input or credential material.' }
          $expected = (Get-FileHash -LiteralPath assets\windows\app.ico -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath (Join-Path $stage 'app.ico') -Algorithm SHA256).Hash -ne $expected) { throw 'Original icon bytes changed.' }
      - name: Upload unsigned native preview, never publish or install
        uses: actions/upload-artifact@v4
        with:
          name: voiceprompt-native-windows-installer
          path: rust/target/installer-output/VoicePrompt-Rust-Setup.exe
          if-no-files-found: error
