name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple/

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --locked ruff check src tests

      - name: Ruff format check
        run: uv run --locked ruff format --check src tests

      - name: Mypy
        run: uv run --locked mypy

      - name: Unit and API tests
        run: uv run --locked pytest --ignore=tests/integration

      - name: Build Rust entity contract oracle
        working-directory: .
        run: |
          cargo fetch --manifest-path rust/Cargo.toml --locked
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example entity_contract

      - name: Bidirectional actual SDK and Python entity parity
        run: uv run --locked python ../rust/cloud/tests/test_entity_parity.py --oracle ../rust/target/release/examples/entity_contract
