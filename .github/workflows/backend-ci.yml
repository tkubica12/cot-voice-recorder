name: backend-ci

on:
  push:
    paths:
      - "rust/**"
      - "scripts/**"
      - "openapi/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/**"
      - "openapi/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple/

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock
      - name: Set up the locked independent test tools
        run: |
          uv python install 3.13
          uv sync --project scripts --locked
      - name: Lint and format independent test hosts
        run: |
          uv run --project scripts --locked ruff check --config scripts/pyproject.toml scripts/azure_api_fixture.py scripts/test_azure_rest.py scripts/measure_backend.py scripts/measure_clients.py scripts/measure_microphone.py scripts/tests/test_azure_api_fixture.py scripts/tests/test_azure_rest_fixture.py scripts/tests/test_backend_measurement_fixture.py scripts/tests/test_full_client_fixture.py scripts/tests/test_microphone_measurement.py rust/tests/test_golden_contracts.py rust/tests/legacy_reference.py rust/tests/jsonschema_lite.py rust/client-protocol/tests/test_client_parity.py rust/windows-pilot/tests/test_recovery_parity.py
          uv run --project scripts --locked ruff format --check --config scripts/pyproject.toml scripts/azure_api_fixture.py scripts/test_azure_rest.py scripts/measure_backend.py scripts/measure_clients.py scripts/measure_microphone.py scripts/tests/test_azure_api_fixture.py scripts/tests/test_azure_rest_fixture.py scripts/tests/test_backend_measurement_fixture.py scripts/tests/test_full_client_fixture.py scripts/tests/test_microphone_measurement.py rust/tests/test_golden_contracts.py rust/tests/legacy_reference.py rust/tests/jsonschema_lite.py rust/client-protocol/tests/test_client_parity.py rust/windows-pilot/tests/test_recovery_parity.py
      - name: Build locked Rust black-box probes
        run: |
          cargo fetch --manifest-path rust/Cargo.toml --locked
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-core --example audio_contract
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-client-protocol --example client_contract
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example entity_contract
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example cloud_contract
      - name: Frozen independent wire and real signed Rust HTTP contracts
        run: uv run --project scripts --locked python rust/tests/test_golden_contracts.py --examples rust/target/release/examples
      - name: Historical report safeguards and current Rust authenticated factory
        run: uv run --project scripts --locked python scripts/tests/test_backend_measurement_fixture.py --rust rust/target/release/examples/cloud_contract
      - name: HTTPS fixture isolation and owned-cleanup safeguards
        run: |
          uv run --project scripts --locked python scripts/tests/test_azure_rest_fixture.py
          uv run --project scripts --locked python scripts/tests/test_azure_api_fixture.py
      - name: Build explicit loopback-only SDK contract adapter
        run: |
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example cloud_contract --features loopback-fixtures
          cargo clippy --manifest-path rust/Cargo.toml --offline --locked -p voiceprompt-cloud --all-targets --features loopback-fixtures -- -D warnings
      - name: Locate actual Rust storage libtest fixture
        run: |
          cargo test --manifest-path rust/Cargo.toml -p voiceprompt-cloud --lib --release --no-run --offline --locked --message-format json > "$RUNNER_TEMP/azure-fixture-build.jsonl"
          python -c "import json,os,pathlib; rows=[json.loads(line) for line in pathlib.Path(os.environ['RUNNER_TEMP'],'azure-fixture-build.jsonl').read_text().splitlines()]; paths=[row['executable'] for row in rows if row.get('reason')=='compiler-artifact' and row.get('executable')]; assert len(paths)==1; pathlib.Path(os.environ['RUNNER_TEMP'],'azure-fixture-path.txt').write_text(paths[0])"
      - name: Verified HTTPS storage, worker, cleanup and one SDK-checked Rust API flow
        timeout-minutes: 20
        run: |
          mkdir "$RUNNER_TEMP/azure-rest-contract"
          uv run --project scripts --locked python scripts/test_azure_rest.py --oracle "$(cat "$RUNNER_TEMP/azure-fixture-path.txt")" --api-oracle rust/target/release/examples/cloud_contract --output-directory "$RUNNER_TEMP/azure-rest-contract" --source-revision "$GITHUB_SHA"
      - name: Preserve bounded contract proof, never ephemeral private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-rest-contract
          path: |
            ${{ runner.temp }}/azure-rest-contract/azure-rest-contract.json
            ${{ runner.temp }}/azure-rest-contract/rust-azure-api-contract.json
            ${{ runner.temp }}/azure-rest-contract/failure.json
            ${{ runner.temp }}/azure-rest-contract/cleanup-failure.json
            ${{ runner.temp }}/azure-rest-contract/native-stdout.txt
            ${{ runner.temp }}/azure-rest-contract/native-stderr.txt
            ${{ runner.temp }}/azure-rest-contract/emulator-log.txt
          if-no-files-found: warn
