name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - "rust/cloud/**"
      - "scripts/backend_fixture.py"
      - "scripts/measure_backend.py"
      - "scripts/azure_api_fixture.py"
      - "scripts/tests/test_azure_api_fixture.py"
      - "scripts/tests/test_backend_measurement_fixture.py"
      - "scripts/test_azure_rest.py"
      - "scripts/tests/test_azure_rest_fixture.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "rust/cloud/**"
      - "scripts/backend_fixture.py"
      - "scripts/measure_backend.py"
      - "scripts/azure_api_fixture.py"
      - "scripts/tests/test_azure_api_fixture.py"
      - "scripts/tests/test_backend_measurement_fixture.py"
      - "scripts/test_azure_rest.py"
      - "scripts/tests/test_azure_rest_fixture.py"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple/

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --locked ruff check src tests

      - name: Ruff format check
        run: uv run --locked ruff format --check src tests

      - name: Mypy
        run: uv run --locked mypy

      - name: Unit and API tests
        run: uv run --locked pytest --ignore=tests/integration

      - name: Build Rust entity contract oracle
        working-directory: .
        run: |
          cargo fetch --manifest-path rust/Cargo.toml --locked
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example entity_contract
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example cloud_contract

      - name: Bidirectional actual SDK and Python entity parity
        run: uv run --locked python ../rust/cloud/tests/test_entity_parity.py --oracle ../rust/target/release/examples/entity_contract

      - name: Exact dictation prompt and Python-to-Rust edit protection parity
        run: uv run --locked python ../rust/cloud/tests/test_edit_parity.py --oracle ../rust/target/release/examples/entity_contract

      - name: Actual Python audit envelope and retrieval parity
        run: uv run --locked python ../rust/cloud/tests/test_archive_parity.py --oracle ../rust/target/release/examples/entity_contract

      - name: Actual asynchronous Python relay and Rust cursor parity
        run: uv run --locked python ../rust/cloud/tests/test_relay_parity.py --oracle ../rust/target/release/examples/entity_contract

      - name: Actual Python overlap stitching, complete Unicode and deterministic ID parity
        run: uv run --locked python ../rust/cloud/tests/test_pipeline_text_parity.py --oracle ../rust/target/release/examples/entity_contract

      - name: Real signed-token Rust HTTP versus current FastAPI contract
        run: uv run --locked python ../rust/cloud/tests/test_http_parity.py --oracle ../rust/target/release/examples/cloud_contract

      - name: Protocol measurement safeguards and actual authenticated factories
        run: |
          uv run --locked ruff check --config pyproject.toml --ignore E402 ../scripts/backend_fixture.py ../scripts/measure_backend.py ../scripts/tests/test_backend_measurement_fixture.py
          uv run --locked ruff format --check --config pyproject.toml ../scripts/backend_fixture.py ../scripts/measure_backend.py ../scripts/tests/test_backend_measurement_fixture.py
          uv run --locked python ../scripts/tests/test_backend_measurement_fixture.py --rust ../rust/target/release/examples/cloud_contract

      - name: Controlled Linux in-memory protocol profile, not deployed cloud acceptance
        timeout-minutes: 10
        run: |
          uv run --locked python ../scripts/measure_backend.py --rust ../rust/target/release/examples/cloud_contract --output "$RUNNER_TEMP/backend-protocol-performance.json" --source-revision "$GITHUB_SHA"

      - name: Preserve every protocol measurement sample and scoped verdict
        uses: actions/upload-artifact@v4
        with:
          name: backend-protocol-performance
          path: ${{ runner.temp }}/backend-protocol-performance.json
          if-no-files-found: error

      - name: HTTPS emulator fixture guards, no Azure or personal credentials
        run: |
          uv run --locked ruff check --config pyproject.toml --ignore E402 ../scripts/test_azure_rest.py ../scripts/tests/test_azure_rest_fixture.py ../scripts/azure_api_fixture.py ../scripts/tests/test_azure_api_fixture.py
          uv run --locked ruff format --check --config pyproject.toml ../scripts/test_azure_rest.py ../scripts/tests/test_azure_rest_fixture.py ../scripts/azure_api_fixture.py ../scripts/tests/test_azure_api_fixture.py
          uv run --locked python ../scripts/tests/test_azure_rest_fixture.py
          uv run --locked python ../scripts/tests/test_azure_api_fixture.py

      - name: Build opt-in loopback-only actual storage API fixture, never production config
        working-directory: .
        run: |
          cargo build --manifest-path rust/Cargo.toml --offline --locked --release -p voiceprompt-cloud --example cloud_contract --features loopback-fixtures
          cargo clippy --manifest-path rust/Cargo.toml --offline --locked -p voiceprompt-cloud --all-targets --features loopback-fixtures -- -D warnings

      - name: Build exact Rust cloud libtest fixture for actual Azure REST contracts
        working-directory: .
        shell: bash
        run: |
          cargo test --manifest-path rust/Cargo.toml -p voiceprompt-cloud --lib --release --no-run --offline --locked --message-format json > "$RUNNER_TEMP/azure-fixture-build.jsonl"
          python -c "import json,os,pathlib; rows=[json.loads(line) for line in pathlib.Path(os.environ['RUNNER_TEMP'],'azure-fixture-build.jsonl').read_text().splitlines()]; paths=[row['executable'] for row in rows if row.get('reason')=='compiler-artifact' and row.get('executable')]; assert len(paths)==1; pathlib.Path(os.environ['RUNNER_TEMP'],'azure-fixture-path.txt').write_text(paths[0])"

      - name: Actual REST contracts and adapter-matched authenticated API profile against verified HTTPS Azurite
        timeout-minutes: 20
        run: |
          mkdir "$RUNNER_TEMP/azure-rest-contract"
          uv run --locked python ../scripts/test_azure_rest.py --oracle "$(cat "$RUNNER_TEMP/azure-fixture-path.txt")" --api-oracle ../rust/target/release/examples/cloud_contract --output-directory "$RUNNER_TEMP/azure-rest-contract" --source-revision "$GITHUB_SHA"

      - name: Preserve bounded emulator proof or explicit failure, never ephemeral private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-rest-contract
          path: |
            ${{ runner.temp }}/azure-rest-contract/azure-rest-contract.json
            ${{ runner.temp }}/azure-rest-contract/backend-azure-performance.json
            ${{ runner.temp }}/azure-rest-contract/failure.json
            ${{ runner.temp }}/azure-rest-contract/cleanup-failure.json
            ${{ runner.temp }}/azure-rest-contract/native-stdout.txt
            ${{ runner.temp }}/azure-rest-contract/native-stderr.txt
            ${{ runner.temp }}/azure-rest-contract/emulator-log.txt
          if-no-files-found: warn
