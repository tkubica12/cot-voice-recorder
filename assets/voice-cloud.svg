<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="Voice cloud: microphone and cloud">
  <title>Voice Cloud</title>
  <desc>A microphone merged with a cloud. Monochrome grays with an orange accent.</desc>

  <!-- Palette: black #111111, gray #6B7280, light #E5E7EB, orange accent #F97316 -->

  <!-- Cloud silhouette -->
  <path d="M74 168
           a40 40 0 0 1 4 -79
           a52 52 0 0 1 100 -8
           a36 36 0 0 1 6 87
           z"
        fill="#E5E7EB" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- Microphone capsule -->
  <rect x="108" y="70" width="40" height="78" rx="20"
        fill="#111111"/>
  <!-- Capsule grille lines (accent) -->
  <line x1="116" y1="90" x2="140" y2="90" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="104" x2="140" y2="104" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
  <line x1="116" y1="118" x2="140" y2="118" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>

  <!-- Microphone cradle (arc) -->
  <path d="M92 132 a36 36 0 0 0 72 0"
        fill="none" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>

  <!-- Stand -->
  <line x1="128" y1="168" x2="128" y2="196" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>
  <line x1="104" y1="196" x2="152" y2="196" stroke="#6B7280" stroke-width="7" stroke-linecap="round"/>

  <!-- Sound wave accent rising into the cloud -->
  <path d="M168 96 q10 -14 0 -28" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M182 100 q18 -20 0 -40" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
</svg>
